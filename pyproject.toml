[project]
name = "myBNB"
version = "0.1.0"
description = "Hotel room and booking management service"
authors = [
    {name = "Alexey Cheremisin", email = "alexeycheremisin.pochta@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0.0,<6.0.0",
    "djangorestframework>=3.14.0,<4.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "ruff>=0.1.0,<0.2.0",
    "pre-commit>=3.0.0,<4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-include = ["*.py", "**/*.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--verbose"
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
]
